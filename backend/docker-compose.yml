services:
  shopcart-db:
    image: postgres:16-alpine
    container_name: shopcart_postgres
    environment:
      POSTGRES_USER: shopcart_user
      POSTGRES_PASSWORD: shopcart_password
      POSTGRES_DB: shopcart_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  shopcart-redis:
    image: redis:7-alpine
    container_name: shopcart_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  db-admin:
    image: dpage/pgadmin4:latest
    container_name: shopcart_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shopcart.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "8081:80"
    depends_on:
      - shopcart-db
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: