spring.application.name=backend

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# Database Connection Configuration (Dynamic)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopcart_dev}
spring.datasource.username=${DB_USER:shopcart_user}
spring.datasource.password=${DB_PASSWORD:shopcart_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API base path
server.servlet.context-path=/api/v1

# JWT Authentication Configuration
# This is a secure 256-bit Hex Key. In production, this would be hidden in environment variables!
jwt.secret=5367566B59707643367639053F423F4528482B4D6251655468576D5A59647437
# Token expiration time in milliseconds (86400000 = 24 hours)
jwt.expiration=86400000